[package]
name = "p2p-share-core"
version = "0.2.0"
edition.workspace = true
description = "Core transfer engine for p2p-share"

[dependencies]
anyhow.workspace = true
blake3.workspace = true
data-encoding.workspace = true
indicatif.workspace = true
iroh.workspace = true
mdns-sd = "0.21"
n0-future.workspace = true
qr2term.workspace = true
serde.workspace = true
serde_json.workspace = true
snow.workspace = true
tar.workspace = true
time.workspace = true
tokio.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
bluer = { version = "0.17", features = ["bluetoothd"], optional = true }
futures-util = { version = "0.3", optional = true }

[features]
# Bluetooth LE discovery through BlueZ (Linux only; needs libdbus at build time).
bluetooth = ["dep:bluer", "dep:futures-util", "tokio/process"]

[dev-dependencies]
tempfile = "3"
